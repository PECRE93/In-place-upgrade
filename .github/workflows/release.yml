name: Release

# Pushing a tag vX.Y.Z publishes a release. Running the workflow by hand (Actions > Release > Run workflow) is a
# dry run: it tests and packages the chosen branch and keeps the package as a workflow artifact.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

jobs:
  # The full CI matrix must pass on the commit before anything is published.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: windows-2025
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history of main, to check that the tag is on it
          persist-credentials: false

      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Test-ModuleManifest -Path src/InPlaceUpgrade/InPlaceUpgrade.psd1).Version.ToString()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG doesn't match ModuleVersion $version." }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG isn't on main. Tag a commit that was merged to main." }

      - name: Package
        run: ./build.ps1 -Task Package

      # Private repositories need GitHub Enterprise Cloud for attestations.
      - name: Attest build provenance
        if: github.event_name == 'push' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/*.zip

      # gh uploads the assets to a draft and then publishes it, so an immutable release is never incomplete.
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG (Get-ChildItem -Path out/*.zip, out/*.sha256).FullName --title $env:TAG --notes-file out/release-notes.md --verify-tag

      - name: Keep the package of the dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            out/*.zip
            out/*.sha256
            out/release-notes.md

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the module version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Test-ModuleManifest -Path src/InPlaceUpgrade/InPlaceUpgrade.psd1).Version.ToString()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG doesn't match ModuleVersion $version." }

      - name: Build, test and package
        run: ./build.ps1 -Task Bootstrap, Analyze, Test, Package

      # Private repositories need GitHub Enterprise Cloud for attestations.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/*.zip

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG (Get-ChildItem -Path out/*.zip, out/*.sha256).FullName --title $env:TAG --notes-file out/release-notes.md --verify-tag
